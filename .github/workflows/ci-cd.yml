name: CI-CD Usuarios API

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/usuarios-api

jobs:
  # 1) Compilación + pruebas unitarias (JUnit 5 + Mockito) + cobertura mínima con JaCoCo
  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar, probar y verificar cobertura (mínimo 70%)
        run: |
          chmod +x mvnw
          ./mvnw -B verify
      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas
          path: |
            target/surefire-reports/
            target/site/jacoco/

  # 2) Análisis de seguridad con Snyk (dependencias + código). Bloquea con severidad alta o crítica
  security:
    name: Análisis de seguridad (Snyk)
    runs-on: ubuntu-latest
    needs: test
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verificar token de Snyk
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::error::Falta el secret SNYK_TOKEN (Settings > Secrets and variables > Actions)"
            exit 1
          fi
      - name: Preparar Maven (permisos y dependencias)
        run: |
          chmod +x mvnw
          ./mvnw -B -q dependency:resolve
      - uses: snyk/actions/setup@master
      - name: Snyk - dependencias (SCA)
        run: snyk test --file=pom.xml --severity-threshold=high
      - name: Snyk - código fuente (SAST)
        run: snyk code test --severity-threshold=high

  # 3) Construcción de la imagen Docker + escaneo con Trivy + publicación en GHCR
  build:
    name: Build y escaneo de imagen
    runs-on: ubuntu-latest
    needs: security
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Construir imagen Docker
        run: |
          docker build \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} \
            -t usuarios-api:${{ github.sha }} .
      - name: Escanear imagen con Trivy (bloquea si hay CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: usuarios-api:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Publicar en GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=${IMAGE_NAME,,}
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker tag usuarios-api:${{ github.sha }} $IMAGE:${{ github.sha }}
          docker tag usuarios-api:${{ github.sha }} $IMAGE:${{ github.ref_name }}
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:${{ github.ref_name }}

  # 4) Despliegue automático en entorno simulado (Docker Compose) - solo desde main
  deploy:
    name: Deploy (entorno simulado)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: produccion-simulada
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Login en GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Levantar stack con la imagen del commit
        run: |
          export IMAGE=${IMAGE_NAME,,}:${{ github.sha }}
          # Contraseñas aleatorias para el entorno efímero (no quedan en el repositorio)
          export DB_PASSWORD=$(openssl rand -hex 16)
          export DB_ROOT_PASSWORD=$(openssl rand -hex 16)
          docker compose pull api
          docker compose up -d --no-build --wait --wait-timeout 300
          docker compose ps
      - name: Smoke test
        run: |
          set -e
          curl -fsS http://localhost:8080/actuator/health
          echo
          curl -fsS http://localhost:8080/api/status
          echo
          curl -fsS -X POST -H "Content-Type: application/json" \
               -d '{"username":"smoke","nombreReal":"Smoke Test","email":"smoke@test.com","contrasena":"Sm0ke!"}' \
               http://localhost:8080/api/usuarios/register
          echo
          curl -fsS -X POST -H "Content-Type: application/json" \
               -d '{"username":"smoke","contrasena":"Sm0ke!"}' \
               http://localhost:8080/api/usuarios/login
      - name: Logs del despliegue
        if: always()
        run: docker compose logs --no-color > deploy-logs.txt || true; tail -n 100 deploy-logs.txt
        env:
          DB_PASSWORD: x
          DB_ROOT_PASSWORD: x
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-despliegue
          path: deploy-logs.txt
      - name: Resumen de trazabilidad
        run: |
          {
            echo "## Despliegue exitoso"
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Commit | \`${{ github.sha }}\` |"
            echo "| Rama | ${{ github.ref_name }} |"
            echo "| Autor | ${{ github.actor }} |"
            echo "| Imagen | \`${IMAGE_NAME,,}:${{ github.sha }}\` |"
            echo "| Run | ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} |"
          } >> $GITHUB_STEP_SUMMARY

  # 5) Alerta: si cualquier etapa falla (fuera de un PR) se abre un Issue automáticamente
  alerta:
    name: Alerta de fallo
    runs-on: ubuntu-latest
    needs: [test, security, build, deploy]
    if: failure() && github.event_name != 'pull_request'
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline fallido en ${context.ref.replace('refs/heads/','')} (${context.sha.substring(0,7)})`,
              body: `El pipeline falló (pruebas, seguridad, build o despliegue).\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nCommit: ${context.sha}\nAutor: ${context.actor}`,
              labels: ['pipeline-fallido']
            });

spring.application.name=usuarios
server.port=8080

# Base de datos: las credenciales se inyectan por variables de entorno (nunca en el repositorio)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hackerfinder?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USER:hackerfinder}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Actuator: solo se expone el endpoint de salud (liveness / readiness)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

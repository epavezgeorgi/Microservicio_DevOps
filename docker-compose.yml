# Orquestación con Docker Compose: MySQL + 2 réplicas de la API + Nginx como balanceador
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hackerfinder
      MYSQL_USER: hackerfinder
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
    ports:
      - "127.0.0.1:3306:3306"     # solo accesible desde tu propio computador (para correr la API desde el IDE)
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    image: ${IMAGE:-usuarios-api:local}
    build: .
    environment:
      DB_URL: jdbc:mysql://db:3306/hackerfinder?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: hackerfinder
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 2                  # escalabilidad horizontal
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
      restart_policy:
        condition: on-failure
    read_only: true                # sistema de archivos de solo lectura
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
